schema: spec-driven

# Standing project constraints. Every change proposal must respect these.
# Fixed constraints and conventions only — aspirations live in brain/ and ADRs.
context: |
  PyLOB is a simulation-for-research limit order book: price-time priority,
  market/limit orders with add/cancel/update, single-threaded, zero-latency
  assumption. It is a library consumed by people running LOB simulations.

  Fixed constraints:
  - Python >= 3.11. uv manages Python versions and dependencies.
  - Toolchain: ruff (format + lint) and pytest, pinned in pyproject's dev
    group and run by ./verify; pytest-timeout is pinned with them and enforces
    pyproject's per-test timeout.
  - Typing: src/PyLOB is fully annotated, every parameter and every return.
    mypy is still not installed, not a dependency, and not a ./verify stage.
    The old "mypy joins once the code is typed" was an intention, and its
    condition passed without the decision being taken; taking it is the
    maintainer's, since ./verify's stage list is not changed without asking.
  - Packaging: pyproject.toml with the hatchling backend; setup.cfg and
    setup.py are gone. The wheel ships src/PyLOB/**/*.py and nothing else.
  - No runtime dependencies. The library imports the standard library only,
    and the optional sink uses stdlib sqlite3.
  - Distribution: public GitHub repo, MIT licence, installable from GitHub.
    No PyPI publishing (the pylob name is held by an unrelated package).
  - The public API (OrderBook.processOrder(dict, fromData, verbose),
    cancelOrder, modifyOrder, getVolumeAtPrice, getBest*/getWorst*, print) is
    kept unless it proves a limiter of performance or clarity; changing it
    needs an ADR. The constraint is about the API's shape, not about which
    engine implements it.
  - Matching is in-memory (ADR-0001, accepted 2026-08-10): price-time priority
    in one layer behind that public API. SQLite is retained only as an
    optional off-hot-path recording/analytics sink. Never put SQL in the
    matching path.
  - There is one engine. ADR-0003 (accepted 2026-08-13) retired the SQL engine
    PR #7 brought in (merged 2023) and replaced the differential oracle with a
    spec-derived reference matcher (tests/reference), which shares no code with
    the engine and is driven through the acceptance suites' adapter surface.

  Scope (this replaces the "single instrument, single currency" line that
  archived proposals were written against; the engine outgrew it):
  - One engine holds many instruments. Every mutating and querying method
    names one, a book springs into being on first mention, and
    configure_instrument gives each instrument its own settlement currency.
    Balances are per (trader, symbol) for instruments and currencies alike.
    This is what the frozen specs are written against -- book-queries per
    instrument, commissions in the instrument's currency, trader-balances in
    each instrument and each currency -- and the differential, replay,
    sink-equality and projection suites all run two instruments, with two
    currencies in play in every one of them. A proposal may assume this; it
    may not reintroduce a single-instrument assumption without an ADR.
  - Instruments and currencies share one balance namespace, so an instrument
    must not be named the same as a currency it settles against.
  - Nothing crosses instruments or currencies: no FX conversion, no
    cross-instrument netting, margin or portfolio view, no multi-leg or
    spread orders, and balances gate nothing (trader-balances). Each of those
    is new capability and needs a spec, not an implementation detail.

  Definition of done: ./verify at the repo root exits 0. Performance work is in
  scope but benchmarks stay out of ./verify.

  Out of scope: PyPI publishing.

  Conventions:
  - Architectural decision records live in docs/adr/; read the index before proposing.
  - src/ layout; the package is src/PyLOB and is pure Python -- it ships no
    data files and reads nothing off disk.
