[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Not published to PyPI: the `pylob` name there belongs to an unrelated
# project. Install from GitHub -- see README.md.
[project]
name = "PyLOB"
version = "0.1.0"
description = "Fast limit order book simulation with price-time priority, for research"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [{ name = "Ash Booth" }]
keywords = ["limit order book", "matching engine", "market simulation", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DrAshBooth/PyLOB"
Repository = "https://github.com/DrAshBooth/PyLOB"
# The wiki was rewritten for the shipped engine in 2026-08; its walkthrough and
# analysis pages are the long-form documentation, so this points there again.
Documentation = "https://github.com/DrAshBooth/PyLOB/wiki"
Issues = "https://github.com/DrAshBooth/PyLOB/issues"

# Pinned exactly: these are the versions ./verify enforced as `uvx ruff@0.9.10`
# and `uvx pytest@8.3.5` before the tools moved into the lockfile.
# `pytest-timeout` is pinned with them: it is a `./verify` dependency in
# practice, because without it a test that hangs hangs the gate.
[dependency-groups]
dev = ["ruff==0.9.10", "pytest==8.3.5", "pytest-timeout==2.3.1"]

# Ruff's defaults are what ./verify has been enforcing; they are written out
# here so a future ruff release cannot change the rule set underneath us.
# `line-length` carries over from setup.cfg's flake8 `max_line_length = 88`;
# its E203/W503 ignores were black-compatibility workarounds with no ruff
# equivalent (W503 does not exist in ruff, E203 is not in the default set).
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Inherited from setup.cfg's [tool:pytest], minus its addopts: `--cov pylob`
# needed pytest-cov and forced every caller to pass `-o addopts=`, and
# `--verbose` fought ./verify's `-q`. `norecursedirs` named build dirs this
# repo does not have.
[tool.pytest.ini_options]
testpaths = ["tests"]
# The slowest test here takes 0.28s and the whole of `./verify` takes seven,
# so thirty seconds is a hundred times the headroom any plausible machine
# contention needs. It is set for the failure mode a matching engine has and
# an assertion cannot catch: a walk that stops advancing does not fail, it
# spins. Two mutants in the 2026-08 review's mutation run (lob-6oj) took the
# suite down that way rather than failing it, and one such run was found still
# burning a core hours after the process that started it had finished.
#
# What this buys is that the run *ends*: a spinning test is failed, named, and
# the process exits. It is not a bound on the suite -- a defect that hangs
# forty tests costs thirty seconds forty times over -- so a slow red run still
# means "something is spinning", and the failures say which tests.
timeout = 30

# Python only. The wheel used to carry the twelve *.sql query files the SQL
# engine loaded as attributes at import time; ADR-0003 retired that engine, and
# nothing in the package reads a file off disk any more. Listed explicitly
# rather than left to the backend's default file selection, so a stray .sql or
# .db appearing under src/PyLOB cannot be picked up and shipped.
[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["src/PyLOB/**/*.py"]
